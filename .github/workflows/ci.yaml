name: checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: messaging
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: messaging_service_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U messaging -d messaging_service_test' --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://messaging:test-only@localhost:5432/messaging_service_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go test -race ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api
      - run: go build ./cmd/service
        working-directory: api
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm test
        working-directory: client
