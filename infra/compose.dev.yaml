name: messaging-service-dev
services:
  db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: messaging
      POSTGRES_DB: messaging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    ports:
      # 5436 on the host: 5432–5434 are taken by other local Postgres instances
      - 127.0.0.1:5436:5432
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U messaging -d messaging]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pg_data:
