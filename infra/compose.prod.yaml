name: messaging-service
services:
  db:
    image: postgres:18.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: messaging
      POSTGRES_DB: messaging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U messaging -d messaging]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://messaging:${POSTGRES_PASSWORD}@db:5432/messaging?sslmode=disable
      API_ADDR: :8080
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
      MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/data/media
    healthcheck:
      test: [CMD, /service, health]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    depends_on: [api]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pg_data:
  media_data:
  caddy_data:
  caddy_config:
