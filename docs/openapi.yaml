            "description": "Provider message ID for quoted replies on official WhatsApp only",
            "type": "string"
          },
          "template": {
            "description": "Existing approved WhatsApp template object: name, language, optional components",
            "type": "object"
          },
          "text": {
            "maxLength": 4096,
            "type": "string"
          }
